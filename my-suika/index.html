<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fdf1dc">
<link rel="manifest" href="manifest.webmanifest">
<title>유비의 수박게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
  :root {
    --bg: #fdf1dc;
    --paper: #fffaf0;
    --ink: #4a2c17;
    --ink-soft: #8a6446;
    --accent: #ef4f5a;
    --accent-dark: #c4323d;
    --green: #3a9a4e;
    --gold: #f2b632;
    --shadow: rgba(74, 44, 23, .18);
    --dot: rgba(74, 44, 23, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #221812; --paper: #2f241b; --ink: #f6e6cf; --ink-soft: #c5a585;
      --green: #6cc77e; --shadow: rgba(0, 0, 0, .45); --dot: rgba(255, 240, 220, .05);
    }
  }
  :root[data-theme="dark"] {
    --bg: #221812; --paper: #2f241b; --ink: #f6e6cf; --ink-soft: #c5a585;
    --green: #6cc77e; --shadow: rgba(0, 0, 0, .45); --dot: rgba(255, 240, 220, .05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; min-height: 100dvh; height: 100dvh;
    display: flex; flex-direction: column; overflow: hidden;
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 1px, transparent 1.4px);
    background-size: 7px 7px;
    color: var(--ink);
    font-family: 'Gaegu', 'Comic Sans MS', system-ui, sans-serif; font-weight: 700;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation; overscroll-behavior: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px 6px; max-width: 1180px; width: 100%; margin: 0 auto; }
  h1 {
    margin: 0; font-size: clamp(28px, 4.4vw, 46px); line-height: 1; color: var(--green);
    text-shadow: 2px 2px 0 var(--paper), 4px 4px 0 var(--shadow); letter-spacing: 1px;
  }
  h1 .seed { color: var(--accent); }
  .sound-btns { display: flex; gap: 8px; }
  .sbtn {
    font: inherit; font-size: 22px; width: 46px; height: 42px; cursor: pointer; color: var(--ink);
    background: var(--paper); border: 2.5px solid var(--ink);
    border-radius: 14px 18px 12px 16px / 16px 12px 18px 14px; box-shadow: 3px 3px 0 var(--shadow);
  }
  .sbtn[aria-pressed="false"] { opacity: .45; text-decoration: line-through; }
  .sbtn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }

  .layout {
    flex: 1; min-height: 0; width: 100%; max-width: 1180px; margin: 0 auto; padding: 4px 16px 14px;
    display: grid; gap: 16px;
    grid-template-columns: minmax(180px, 250px) minmax(0, 1fr) minmax(140px, 185px);
    grid-template-areas: "left stage right";
  }
  .panel {
    background: var(--paper); border: 3px solid var(--ink);
    border-radius: 20px 26px 18px 28px / 26px 18px 28px 20px;
    box-shadow: 4px 5px 0 var(--shadow); padding: 12px 14px;
  }
  .label { font-size: 17px; color: var(--ink-soft); }
  .left { grid-area: left; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .right { grid-area: right; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .stage { grid-area: stage; min-height: 0; min-width: 0; display: flex; justify-content: center; align-items: flex-start; }

  .now b { display: block; font-size: 48px; line-height: 1; font-variant-numeric: tabular-nums; }
  .now .combo { font-size: 18px; color: var(--accent); min-height: 22px; transform-origin: left center; transition: transform .15s; }
  .now .combo.bump { animation: comboBump .3s ease-out; }
  @keyframes comboBump { 0% { filter: brightness(1.6); translate: 0 -3px; } 100% { filter: none; translate: 0 0; } }
  .board-card { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .board-card h2 { margin: 0 0 6px; font-size: 26px; }
  .ranks { list-style: none; margin: 0; padding: 0; overflow: auto; min-height: 0; }
  .ranks li {
    display: grid; grid-template-columns: 30px 1fr; grid-template-rows: auto auto; column-gap: 6px;
    padding: 5px 4px; border-bottom: 2px dashed var(--shadow);
  }
  .ranks li:last-child { border-bottom: 0; }
  .ranks .medal { grid-row: span 2; font-size: 20px; align-self: center; text-align: center; color: var(--ink-soft); }
  .ranks .pts { font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; }
  .ranks .when { font-size: 14px; color: var(--ink-soft); font-weight: 400; }
  .ranks li.new { background: color-mix(in srgb, var(--gold) 28%, transparent); border-radius: 10px; animation: shine 1.2s ease-in-out 3; }
  .ranks .empty { display: block; color: var(--ink-soft); font-weight: 400; padding: 10px 0; }
  @keyframes shine { 50% { background: color-mix(in srgb, var(--gold) 60%, transparent); } }

  .next-card, .ring-card { text-align: center; }
  .next-card canvas { width: 100%; max-width: 154px; height: auto; display: block; margin: 0 auto; }
  .ring-card canvas { width: 100%; max-width: 182px; height: auto; display: block; margin: 0 auto; }

  .board { position: relative; touch-action: none; }
  #game { display: block; width: 100%; height: 100%; cursor: pointer; }
  .overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(40, 24, 10, .4); border-radius: 18px; }
  .overlay.show { display: flex; }
  .modal { text-align: center; min-width: 250px; padding: 22px 28px; animation: pop .4s cubic-bezier(.2, 1.6, .4, 1); }
  .modal h3 { margin: 0; font-size: 36px; }
  .modal .big { font-size: 62px; line-height: 1.05; color: var(--accent); }
  .modal p { margin: 3px 0; color: var(--ink-soft); font-size: 18px; }
  .modal button {
    margin-top: 14px; font: inherit; font-size: 24px; padding: 8px 30px; cursor: pointer;
    background: var(--accent); color: #fff; border: 3px solid var(--ink);
    border-radius: 999px; box-shadow: 3px 4px 0 var(--shadow);
  }
  .modal button:active { transform: translate(2px, 2px); box-shadow: 1px 2px 0 var(--shadow); }
  @keyframes pop { from { transform: scale(.6) rotate(-4deg); opacity: 0; } to { transform: none; opacity: 1; } }

  .rank-btn, .close-ranks { display: none; }

  /* 세로 모바일: 한 화면 고정. 점수·다음 과일·진화의 고리 → 게임, 랭킹보드는 🏆 버튼으로 여닫음 */
  @media (max-width: 820px) and (orientation: portrait), (max-width: 560px) {
    .top { padding: 8px 12px 4px; }
    h1 { font-size: clamp(19px, 6.6vw, 32px); white-space: nowrap; letter-spacing: 0; text-shadow: 1px 1px 0 var(--paper), 3px 3px 0 var(--shadow); }
    .sound-btns { gap: 6px; }
    .sbtn { width: clamp(34px, 10.6vw, 40px); height: 36px; font-size: 17px; padding: 0; border-radius: 12px; box-shadow: 2px 2px 0 var(--shadow); }
    .rank-btn { display: inline-block; }
    .stage { align-items: center; }
    .layout {
      padding: 4px 12px 10px; gap: 8px;
      grid-template-columns: minmax(0, 1fr) auto auto; grid-template-rows: auto minmax(0, 1fr);
      grid-template-areas: "now next ring" "stage stage stage";
    }
    .left, .right { display: contents; }
    .panel { border-width: 2.5px; box-shadow: 3px 3px 0 var(--shadow); }
    .label { font-size: 14px; }
    .now { grid-area: now; padding: 6px 12px; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
    .now b { font-size: clamp(28px, 9vw, 40px); }
    .now .combo { font-size: 15px; min-height: 18px; white-space: nowrap; }
    .next-card { grid-area: next; padding: 4px 6px; display: flex; flex-direction: column; justify-content: center; }
    .next-card canvas { width: auto; height: clamp(38px, 6.3dvh, 53px); }
    .ring-card { grid-area: ring; padding: 4px; display: flex; align-items: center; }
    .ring-card canvas { width: auto; height: clamp(52px, 8.4dvh, 73px); }
    /* 랭킹보드는 화면 위에 뜨는 시트 */
    .board-card {
      display: none; position: fixed; z-index: 30;
      left: 12px; right: 12px; top: calc(60px + env(safe-area-inset-top)); max-height: 70dvh;
      box-shadow: 0 0 0 100vmax rgba(40, 24, 10, .45), 4px 5px 0 var(--shadow);
    }
    .board-card.open { display: flex; animation: pop .3s cubic-bezier(.2, 1.4, .4, 1); }
    .board-card h2 { display: flex; align-items: center; justify-content: space-between; }
    .close-ranks { display: inline-block; font-size: 18px; width: 38px; height: 34px; }
    .modal { min-width: 0; width: min(86%, 300px); padding: 16px 18px; }
    .modal h3 { font-size: 28px; }
    .modal .big { font-size: 48px; }
    .modal p { font-size: 16px; }
    .modal button { font-size: 22px; padding: 6px 26px; }
  }

  /* 세로 전용: 휴대폰·태블릿을 가로로 돌리면 게임을 멈추고 세로로 돌려 달라고 안내 */
  .rotate-msg { display: none; }
  @media (orientation: landscape) and (pointer: coarse) and (max-height: 600px) {
    .top, .layout { display: none; }
    .rotate-msg {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      height: 100%; text-align: center; font-size: 26px; color: var(--ink);
    }
    .rotate-msg .phone { font-size: 64px; animation: tilt 1.6s ease-in-out infinite; }
    .rotate-msg small { font-size: 17px; color: var(--ink-soft); }
  }
  @keyframes tilt { 0%, 30% { transform: rotate(-90deg); } 60%, 100% { transform: rotate(0); } }
</style>
</head>
<body>
<header class="top">
  <h1>유비의 수박게임<span class="seed">!</span></h1>
  <div class="sound-btns">
    <button class="sbtn" id="bgmBtn" aria-label="배경음악" title="배경음악">🎵</button>
    <button class="sbtn" id="sfxBtn" aria-label="효과음" title="효과음">🔊</button>
    <button class="sbtn rank-btn" id="rankBtn" aria-label="랭킹보드" title="랭킹보드">🏆</button>
  </div>
</header>

<div class="rotate-msg" role="alert">
  <div class="phone">📱</div>
  휴대폰을 세로로 돌려 주세요
  <small>유비의 수박게임은 세로 화면에서만 플레이할 수 있어요</small>
</div>

<main class="layout">
  <aside class="left">
    <div class="panel now">
      <div class="label">지금 점수</div>
      <b id="score">0</b>
      <div class="combo" id="comboText"></div>
    </div>
    <div class="panel board-card">
      <h2>🏆 랭킹보드 <button class="sbtn close-ranks" id="closeRanks" aria-label="닫기">✕</button></h2>
      <ol class="ranks" id="ranks"></ol>
    </div>
  </aside>

  <section class="stage" id="stage">
    <div class="board" id="board">
      <canvas id="game" width="560" height="760"></canvas>
      <div class="overlay" id="overlay">
        <div class="panel modal">
          <h3 id="overTitle">게임 오버</h3>
          <div class="big" id="finalScore">0</div>
          <p id="finalRank"></p>
          <p id="finalStats"></p>
          <button id="restartBtn">다시 하기</button>
        </div>
      </div>
    </div>
  </section>

  <aside class="right">
    <div class="panel next-card">
      <div class="label">다음 과일</div>
      <canvas id="nextCanvas" width="240" height="200"></canvas>
    </div>
    <div class="panel ring-card">
      <canvas id="ringCanvas" width="400" height="400"></canvas>
    </div>
  </aside>
</main>

<script>
(() => {
  const { Engine, Bodies, Body, Composite, Events } = Matter;

  // ================= 설정 =================
  const W = 560, H = 760;
  const WALL = 28, FLOOR = 30, FLOOR_Y = H - FLOOR;   // 물리 벽 = 상자 앞 기둥 안쪽 면
  const TOP = 150, DEPTH = 24;                        // 상자 윗면 높이와 원근 깊이
  const CLOUD_Y = 46, HOLD_Y = 96, DANGER_Y = TOP + 56; // 상자 안쪽의 가상 레드라인
  const TONGUE_MS = 1200, POP_MS = 220, DROP_COOLDOWN = 550, OVER_GRACE = 500, SPAWN_GRACE = 1200, COMBO_WINDOW = 900;
  const BOUNCE_SMALL = 0.6, BOUNCE_BIG = 0.32, SIDE_DAMP = 0.75;
  const SQUASH_K = 620, SQUASH_DAMP = 24;
  const MERGE_START = 0.55, MERGE_GROW = 1.07;
  const INK = '#4a2c17';

  const FRUITS = [
    { name: '체리',     r: 17,  color: '#a3122f', kind: 'cherry' },
    { name: '딸기',     r: 23,  color: '#ff4f7e', kind: 'strawberry' },
    { name: '블루베리', r: 31,  color: '#4a63d6', kind: 'blueberry' },
    { name: '오렌지',   r: 36,  color: '#ffb21c', kind: 'orange' },
    { name: '감',       r: 45,  color: '#e85215', kind: 'persimmon' },
    { name: '사과',     r: 56,  color: '#ef3b36', kind: 'apple' },
    { name: '배',       r: 65,  color: '#f0d86a', kind: 'pear' },
    { name: '복숭아',   r: 80,  color: '#ffb8a6', kind: 'peach' },
    { name: '파인애플', r: 91,  color: '#f7c63b', kind: 'pineapple' },
    { name: '멜론',     r: 111, color: '#a8d66b', kind: 'melon' },
    { name: '수박',     r: 130, color: '#3aa856', kind: 'watermelon' },
  ];
  // 단단하고 둥근 과일: 윤곽을 매끈하게, 부딪힐 때 찌그러짐도 작게
  const ROUND = new Set(['orange', 'apple', 'pear', 'peach', 'melon', 'watermelon']);
  const SQUISH = FRUITS.map(f => ROUND.has(f.kind) ? 0.3 : 1);
  const FACE_INK = ['#fff3d6', '#2a0712'];
  const SCORES = [1, 3, 6, 10, 15, 21, 28, 36, 45, 55, 66];
  const MAX = FRUITS.length - 1;

  const storage = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  // ================= 크레파스 드로잉 도구 =================
  function rng(seed) {
    return () => {
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shade(hex, amt) { // amt > 0 밝게, < 0 어둡게
    const n = parseInt(hex.slice(1), 16), ch = s => (n >> s) & 255;
    const f = v => Math.round(amt >= 0 ? v + (255 - v) * amt : v * (1 + amt));
    return `rgb(${f(ch(16))},${f(ch(8))},${f(ch(0))})`;
  }
  // 손으로 그린 듯 살짝 울퉁불퉁한 원
  function blobPoints(r, rnd, amp = 0.022) {
    const p1 = rnd() * 6.28, p2 = rnd() * 6.28, pts = [];
    for (let i = 0; i < 48; i++) {
      const a = i / 48 * Math.PI * 2, rr = r * (1 + amp * Math.sin(a * 3 + p1) + amp * 0.6 * Math.sin(a * 5 + p2));
      pts.push([Math.cos(a) * rr, Math.sin(a) * rr]);
    }
    return pts;
  }
  function polyPath(c, pts) { c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); }
  // 굵은 크레파스 외곽선: 진하게 한 번 + 살짝 어긋나게 한 번
  function crayonOutline(c, path, w, color = INK) {
    c.save(); c.strokeStyle = color; c.lineJoin = 'round'; c.lineCap = 'round';
    c.globalAlpha = 0.92; c.lineWidth = w; path(); c.stroke();
    c.globalAlpha = 0.4; c.lineWidth = w * 0.5; c.translate(0.9, -0.7); path(); c.stroke();
    c.restore();
  }
  // 짧은 크레파스 빗금. weight(nx, ny)로 영역별 농도 조절
  function scribble(c, rnd, o) {
    const { x0, y0, x1, y1, count, len, width, angle = -0.9, color, alpha, weight = () => 1 } = o;
    c.save(); c.strokeStyle = color; c.lineCap = 'round';
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, hw = (x1 - x0) / 2, hh = (y1 - y0) / 2;
    for (let i = 0; i < count; i++) {
      const x = x0 + rnd() * (x1 - x0), y = y0 + rnd() * (y1 - y0);
      if (rnd() > weight((x - cx) / hw, (y - cy) / hh)) continue;
      const a = angle + (rnd() - 0.5) * 0.35, L = len * (0.5 + rnd());
      c.globalAlpha = alpha * (0.45 + 0.55 * rnd()); c.lineWidth = width * (0.6 + 0.8 * rnd());
      c.beginPath(); c.moveTo(x - Math.cos(a) * L / 2, y - Math.sin(a) * L / 2); c.lineTo(x + Math.cos(a) * L / 2, y + Math.sin(a) * L / 2); c.stroke();
    }
    c.restore();
  }
  const clamp01 = v => Math.max(0, Math.min(1, v));
  function leaf(c, rnd, x, y, len, wid, ang, color, lw) {
    c.save(); c.translate(x, y); c.rotate(ang);
    const path = () => { c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(len * 0.5, -wid, len, 0); c.quadraticCurveTo(len * 0.5, wid, 0, 0); c.closePath(); };
    path(); c.fillStyle = color; c.fill();
    c.save(); path(); c.clip();
    scribble(c, rnd, { x0: 0, y0: -wid, x1: len, y1: wid, count: len * 3, len: wid * 0.8, width: 1.4, color: shade(color, -0.35), alpha: 0.35, weight: (nx, ny) => ny > 0 ? 0.9 : 0.3 });
    c.restore();
    c.strokeStyle = shade(color, -0.4); c.lineWidth = Math.max(1, lw * 0.45); c.globalAlpha = 0.7;
    c.beginPath(); c.moveTo(len * 0.1, 0); c.quadraticCurveTo(len * 0.5, -wid * 0.15, len * 0.85, 0); c.stroke(); c.globalAlpha = 1;
    crayonOutline(c, path, lw * 0.75);
    c.restore();
  }
  // 파인애플 왕관용: 밑동이 넓고 끝이 뾰족하며 바깥으로 휘는 두꺼운 잎
  function spike(c, rnd, x, y, len, wid, ang, bend, color, lw) {
    c.save(); c.translate(x, y); c.rotate(ang);
    const path = () => {
      c.beginPath(); c.moveTo(0, -wid);
      c.quadraticCurveTo(len * 0.55, -wid * 0.75 + bend * 0.4, len, bend);
      c.quadraticCurveTo(len * 0.5, wid * 0.8 + bend * 0.5, 0, wid);
      c.closePath();
    };
    path(); c.fillStyle = color; c.fill();
    c.save(); path(); c.clip();
    scribble(c, rnd, { x0: 0, y0: -wid, x1: len, y1: wid + Math.abs(bend), count: len * 2.5, len: wid * 0.9, width: 1.4, angle: 0.15, color: shade(color, -0.35), alpha: 0.4, weight: (nx, ny) => ny > 0 ? 0.9 : 0.25 });
    scribble(c, rnd, { x0: 0, y0: -wid, x1: len * 0.7, y1: 0, count: len * 1.2, len: wid * 0.7, width: 1.2, angle: 0.1, color: shade(color, 0.4), alpha: 0.45 });
    c.restore();
    c.strokeStyle = shade(color, -0.42); c.lineWidth = Math.max(1, lw * 0.45); c.globalAlpha = 0.75;
    c.beginPath(); c.moveTo(len * 0.05, 0); c.quadraticCurveTo(len * 0.55, bend * 0.3, len * 0.9, bend * 0.92); c.stroke(); c.globalAlpha = 1;
    crayonOutline(c, path, lw * 0.75);
    c.restore();
  }
  function stem(c, x0, y0, cx, cy, x1, y1, w, lw, color = '#7a4b26') {
    const path = () => { c.beginPath(); c.moveTo(x0, y0); c.quadraticCurveTo(cx, cy, x1, y1); };
    c.save(); c.lineCap = 'round';
    c.strokeStyle = INK; c.lineWidth = w + lw * 1.4; path(); c.stroke();
    c.strokeStyle = color; c.lineWidth = w; path(); c.stroke();
    c.restore();
  }

  // ================= 과일 스프라이트 (크레파스 화풍, 자체 디자인) =================
  const SS = 2; // 고해상도 렌더 배율
  function buildFruitBody(lv) {
    const f = FRUITS[lv], r = f.r, rnd = rng(1000 + lv * 97);
    const pad = Math.ceil(r * (f.kind === 'pineapple' ? 0.7 : 0.62)) + 8, size = (r + pad) * 2;
    const cv = document.createElement('canvas'); cv.width = cv.height = size * SS;
    const c = cv.getContext('2d'); c.scale(SS, SS); c.translate(size / 2, size / 2);
    const lw = 2.2 + r * 0.032;
    const pts = blobPoints(r, rnd, ROUND.has(f.kind) || f.kind === 'pineapple' ? 0.006 : 0.022), body = () => polyPath(c, pts);
    const dark = shade(f.color, -0.32), light = shade(f.color, 0.35);

    // --- 몸통 뒤 장식 ---
    if (f.kind === 'cherry') {
      stem(c, 0, -r * 0.75, r * 0.15, -r * 1.5, r * 0.8, -r * 1.55, r * 0.13, lw, '#6d8f2c');
      leaf(c, rnd, r * 0.7, -r * 1.5, r * 0.75, r * 0.28, -0.3, '#5fae45', lw);
    } else if (f.kind === 'pineapple') {
      // 짧고 넓은 연두 잎 5장이 부채꼴로 넓게 펼쳐진 왕관 (바깥 잎은 거의 옆으로 눕힘)
      [[-1.25, 0.6, '#6fbb3e'], [1.25, 0.6, '#6fbb3e'], [-0.62, 0.7, '#80c94a'], [0.62, 0.7, '#80c94a'], [0, 0.72, '#92d556']].forEach(([t, len, col]) =>
        spike(c, rnd, t * r * 0.16, -r * 0.74, r * len, r * 0.27, -Math.PI / 2 + t, Math.sign(t) * r * 0.14, col, lw));
    }

    // --- 몸통 ---
    body(); c.fillStyle = f.color; c.fill();
    c.save(); body(); c.clip();
    const box = { x0: -r, y0: -r, x1: r, y1: r };
    // 그림자 빗금(오른쪽 아래) / 밝은 빗금(왼쪽 위)
    scribble(c, rnd, { ...box, count: r * r * 0.11, len: r * 0.28 + 4, width: 1.6 + r * 0.012, color: dark, alpha: 0.45, weight: (x, y) => Math.pow(clamp01((x * 0.55 + y * 0.8) * 0.9 + 0.25), 1.6) });
    scribble(c, rnd, { ...box, count: r * r * 0.05, len: r * 0.25 + 3, width: 1.4 + r * 0.01, color: light, alpha: 0.5, weight: (x, y) => clamp01(-(x * 0.6 + y * 0.8) * 0.9) });

    if (f.kind === 'strawberry') {
      for (let i = 0; i < 18; i++) {
        const a = rnd() * Math.PI * 2, d = r * Math.sqrt(rnd()) * 0.82, sx = Math.cos(a) * d, sy = Math.sin(a) * d;
        if (sy < -r * 0.45 || (Math.abs(sx) < r * 0.55 && sy > -r * 0.12 && sy < r * 0.5)) continue;
        c.fillStyle = '#ffeaa0'; c.strokeStyle = shade(f.color, -0.45); c.lineWidth = 0.9;
        c.beginPath(); c.ellipse(sx, sy, r * 0.045, r * 0.075, a, 0, 7); c.fill(); c.stroke();
      }
    } else if (f.kind === 'blueberry') {
      // 하얀 분(가루) 낀 겉면 + 꼭지 쪽 별 모양 왕관
      scribble(c, rnd, { ...box, count: r * r * 0.07, len: r * 0.22, width: 2, color: '#c9d6ff', alpha: 0.35, weight: (x, y) => clamp01(1 - Math.hypot(x + 0.2, y + 0.1)) });
      const cy0 = -r * 0.5, cr = r * 0.26;
      c.fillStyle = '#26307a'; c.strokeStyle = INK; c.lineWidth = 1 + r * 0.025; c.lineJoin = 'round';
      c.beginPath();
      for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? cr * 0.45 : cr; c.lineTo(Math.cos(a) * rr, cy0 + Math.sin(a) * rr * 0.75); }
      c.closePath(); c.fill(); c.stroke();
    } else if (f.kind === 'orange' || f.kind === 'persimmon' || f.kind === 'pear') {
      const dot = f.kind === 'pear' ? 'rgba(150,105,30,.45)' : shade(f.color, -0.25);
      for (let i = 0; i < (f.kind === 'pear' ? 40 : 26); i++) {
        const a = rnd() * 6.28, d = r * Math.sqrt(rnd()) * 0.9;
        c.fillStyle = dot; c.beginPath(); c.arc(Math.cos(a) * d, Math.sin(a) * d, 0.8 + r * 0.022, 0, 7); c.fill();
      }
    } else if (f.kind === 'peach') {
      scribble(c, rnd, { ...box, count: r * r * 0.06, len: r * 0.25, width: 2.4, color: '#ff7f8a', alpha: 0.45, weight: (x, y) => clamp01(1 - Math.hypot(x - 0.35, y + 0.2) * 1.4) });
      c.strokeStyle = shade(f.color, -0.35); c.lineWidth = lw * 0.9; c.lineCap = 'round';
      c.beginPath(); c.moveTo(r * 0.02, -r * 0.95); c.quadraticCurveTo(r * 0.38, -r * 0.2, r * 0.05, r * 0.8); c.stroke();
    } else if (f.kind === 'pineapple') {
      c.strokeStyle = '#c27812'; c.lineWidth = 1.5 + r * 0.03; c.globalAlpha = 0.75; c.lineCap = 'round';
      for (let i = -6; i <= 6; i++) {
        c.beginPath(); c.moveTo(i * r * 0.34 - r, -r); c.lineTo(i * r * 0.34 + r, r); c.stroke();
        c.beginPath(); c.moveTo(i * r * 0.34 + r, -r); c.lineTo(i * r * 0.34 - r, r); c.stroke();
      }
      c.globalAlpha = 1; c.fillStyle = '#a8620e';
      for (let i = -4; i <= 4; i++) for (let j = -4; j <= 4; j++) {
        const px = (i + (j % 2 ? 0.5 : 0)) * r * 0.34, py = j * r * 0.34 * 0.5 + r * 0.03;
        c.beginPath(); c.arc(px, py * 2 - r * 0.34 * 0.5 * (j % 2 ? 1 : 0), 1 + r * 0.02, 0, 7); c.fill();
      }
    } else if (f.kind === 'melon') {
      c.strokeStyle = '#f6ffe8'; c.lineWidth = 1.4 + r * 0.018; c.globalAlpha = 0.8; c.lineCap = 'round';
      for (let dir = 0; dir < 2; dir++) for (let i = -5; i <= 5; i++) {
        c.beginPath();
        for (let k = 0; k <= 20; k++) {
          const t = -r + k * r * 0.1, o = i * r * 0.22 + Math.sin(k * 1.3 + i * 2 + dir) * r * 0.05;
          dir ? (k ? c.lineTo(o, t) : c.moveTo(o, t)) : (k ? c.lineTo(t, o) : c.moveTo(t, o));
        }
        c.stroke();
      }
      c.globalAlpha = 1;
    } else if (f.kind === 'watermelon') {
      for (let i = -3; i <= 3; i++) {
        const x0 = i * r * 0.31;
        c.beginPath(); c.moveTo(x0, -r);
        for (let k = 0; k <= 12; k++) c.lineTo(x0 + (k % 2 ? 1 : -1) * r * 0.07 + Math.sin(k) * r * 0.02, -r + k * r / 6);
        for (let k = 12; k >= 0; k--) c.lineTo(x0 + r * 0.11 + (k % 2 ? 1 : -1) * r * 0.07, -r + k * r / 6);
        c.closePath(); c.fillStyle = '#1e6431'; c.fill();
      }
      scribble(c, rnd, { ...box, count: r * r * 0.05, len: r * 0.2, width: 2, color: '#123f20', alpha: 0.35, weight: (x, y) => clamp01(x * 0.5 + y * 0.7 + 0.2) });
    }
    // 종이 결 (크레파스 사이로 비치는 흰 종이)
    scribble(c, rnd, { ...box, count: r * r * 0.09, len: 2.5, width: 1.1, angle: -0.6, color: '#fff7e6', alpha: 0.4 });
    // 하이라이트 낙서
    c.strokeStyle = '#ffffff'; c.lineCap = 'round'; c.lineWidth = 1.5 + r * 0.055; c.globalAlpha = 0.85;
    c.beginPath();
    for (let k = 0; k < 4; k++) {
      const a = Math.PI * (1.08 + k * 0.08), rr = r * 0.66;
      c.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); c.lineTo(Math.cos(a + 0.12) * (rr - r * 0.14), Math.sin(a + 0.12) * (rr - r * 0.14));
    }
    c.stroke(); c.globalAlpha = 1;
    c.restore();
    crayonOutline(c, body, lw);

    // --- 몸통 앞 장식 ---
    if (f.kind === 'strawberry' || f.kind === 'persimmon') {
      const n = f.kind === 'persimmon' ? 4 : 6, col = f.kind === 'persimmon' ? '#6f8f2a' : '#47a64e';
      for (let i = 0; i < n; i++) {
        const a = -Math.PI / 2 + (i - (n - 1) / 2) * (f.kind === 'persimmon' ? 0.7 : 0.48);
        leaf(c, rnd, 0, -r * 0.82, r * 0.42, r * 0.13, a + (a < -Math.PI / 2 ? -0.9 : 0.9) * 0.6 + Math.PI / 2 * 0, col, lw);
      }
      if (f.kind === 'persimmon') stem(c, 0, -r * 0.82, 0, -r * 0.9, r * 0.03, -r * 1.0, r * 0.08, lw);
    } else if (['orange', 'apple', 'pear', 'peach'].includes(f.kind)) {
      stem(c, 0, -r * 0.82, r * 0.02, -r * 0.95, r * 0.08, -r * 1.12, r * 0.08, lw);
      leaf(c, rnd, r * 0.06, -r * 1.02, r * 0.5, r * 0.17, f.kind === 'peach' ? -0.1 : -0.45, '#5aa83e', lw);
      if (f.kind === 'peach') leaf(c, rnd, r * 0.02, -r * 1.0, r * 0.42, r * 0.15, Math.PI + 0.35, '#4c9636', lw);
    }
    if (f.kind === 'melon' || f.kind === 'watermelon') {
      stem(c, 0, -r * 0.9, r * 0.02, -r * 1.02, r * 0.12, -r * 1.06, r * 0.05, lw, '#5a7a2a');
      c.save(); c.strokeStyle = '#5a7a2a'; c.lineWidth = r * 0.025; c.lineCap = 'round';
      c.beginPath(); c.arc(r * 0.17, -r * 1.06, r * 0.05, Math.PI, Math.PI * 2.6); c.stroke(); c.restore();
    }
    return { canvas: cv, size };
  }

  function addFace(base, lv, face) {
    const f = FRUITS[lv], r = f.r, lw = 2.2 + r * 0.032, rnd = rng(500 + lv);
    const cv = document.createElement('canvas'); cv.width = cv.height = base.canvas.width;
    const c = cv.getContext('2d'); c.drawImage(base.canvas, 0, 0);
    c.scale(SS, SS); c.translate(base.size / 2, base.size / 2);
    // 진한 빨강 체리는 밝은 크림색, 무늬 많은 딸기는 아주 진한 색으로 얼굴을 그려 눈에 띄게
    const ink = FACE_INK[lv] || INK, hi = lv === 0 ? '#8a0f2a' : '#fff';
    const ex = r * 0.3, ey = r * 0.1, es = Math.max(lv < 2 ? 2.4 : 1.9, r * (lv < 2 ? 0.1 : 0.085));
    c.fillStyle = ink; c.strokeStyle = ink; c.lineCap = 'round'; c.lineJoin = 'round';
    const closedEyes = (curve) => [-1, 1].forEach(s => { c.beginPath(); c.arc(s * ex, ey + es * 0.2 * curve, es * 0.95, Math.PI * (curve > 0 ? 1.15 : 0.15), Math.PI * (curve > 0 ? 1.85 : 0.85)); c.stroke(); });
    if (face === 'blink') {
      c.lineWidth = Math.max(1.6, lw * 0.75); closedEyes(-1);
      c.lineWidth = Math.max(1.4, lw * 0.6);
      c.beginPath(); c.arc(-r * 0.055, ey + r * 0.14, r * 0.055, 0.1 * Math.PI, 0.9 * Math.PI); c.arc(r * 0.055, ey + r * 0.14, r * 0.055, 0.1 * Math.PI, 0.9 * Math.PI); c.stroke();
    } else if (face === 'shut') {
      // 질끈 감은 눈 > < 와 꽉 다문 입
      c.lineWidth = Math.max(1.8, lw * 0.85);
      [-1, 1].forEach(s => { c.beginPath(); c.moveTo(s * ex - s * es, ey - es); c.lineTo(s * ex + s * es * 0.7, ey); c.lineTo(s * ex - s * es, ey + es); c.stroke(); });
      c.beginPath(); c.moveTo(-r * 0.1, ey + r * 0.24); c.quadraticCurveTo(0, ey + r * 0.17, r * 0.1, ey + r * 0.24); c.stroke();
      [-1, 1].forEach(s => { c.beginPath(); c.moveTo(s * (ex + es * 2), ey - es * 1.6); c.lineTo(s * (ex + es * 3.2), ey - es * 2.6); c.stroke(); });
    } else if (face === 'shock') {
      // 휘둥그레 눈과 크게 벌린 입 (으악!)
      [-1, 1].forEach(s => {
        c.fillStyle = '#fff'; c.beginPath(); c.arc(s * ex, ey - es * 0.3, es * 1.75, 0, 7); c.fill();
        c.lineWidth = Math.max(1.3, lw * 0.55); c.stroke();
        c.fillStyle = ink; c.beginPath(); c.arc(s * ex, ey - es * 0.3, es * 0.45, 0, 7); c.fill();
      });
      c.fillStyle = '#7a1f2b'; c.beginPath(); c.ellipse(0, ey + r * 0.27, r * 0.1, r * 0.14, 0, 0, 7); c.fill(); c.lineWidth = Math.max(1.3, lw * 0.55); c.stroke();
      c.fillStyle = '#ff8fa0'; c.beginPath(); c.ellipse(0, ey + r * 0.34, r * 0.06, r * 0.04, 0, 0, 7); c.fill();
    } else if (face === 'dizzy') {
      // X 눈과 혀 내민 입
      c.lineWidth = Math.max(1.8, lw * 0.85);
      [-1, 1].forEach(s => { const x = s * ex, d = es * 0.9; c.beginPath(); c.moveTo(x - d, ey - d); c.lineTo(x + d, ey + d); c.moveTo(x + d, ey - d); c.lineTo(x - d, ey + d); c.stroke(); });
      c.lineWidth = Math.max(1.4, lw * 0.6);
      c.beginPath(); c.moveTo(-r * 0.12, ey + r * 0.2); c.lineTo(r * 0.12, ey + r * 0.2); c.stroke();
      c.fillStyle = '#ff7b8f'; c.beginPath(); c.arc(r * 0.04, ey + r * 0.24, r * 0.06, 0, Math.PI); c.fill(); c.stroke();
    } else if (face === 'squish') {
      c.lineWidth = Math.max(1.6, lw * 0.75);
      [-1, 1].forEach(s => { c.beginPath(); c.moveTo(s * ex - s * es, ey - es * 0.9); c.lineTo(s * ex + s * es * 0.6, ey); c.lineTo(s * ex - s * es, ey + es * 0.9); c.stroke(); });
      c.beginPath(); c.ellipse(0, ey + r * 0.2, r * 0.07, r * 0.09, 0, 0, 7); c.fill();
    } else if (face === 'scared') {
      [-1, 1].forEach(s => {
        c.fillStyle = '#fff'; c.beginPath(); c.arc(s * ex, ey, es * 1.5, 0, 7); c.fill();
        c.lineWidth = Math.max(1.2, lw * 0.5); c.stroke();
        c.fillStyle = ink; c.beginPath(); c.arc(s * ex, ey + es * 0.2, es * 0.6, 0, 7); c.fill();
      });
      c.lineWidth = Math.max(1.4, lw * 0.6); c.beginPath();
      for (let k = 0; k <= 4; k++) c.lineTo(-r * 0.14 + k * r * 0.07, ey + r * 0.28 + (k % 2 ? -1 : 1) * r * 0.025);
      c.stroke();
    } else if (face === 'tongue' || face === 'tongue2') {
      // 메롱: 한쪽 윙크(또는 웃는 눈) + 혀 쏙
      c.lineWidth = Math.max(1.6, lw * 0.75);
      if (face === 'tongue') {
        c.fillStyle = ink; c.beginPath(); c.ellipse(-ex, ey, es * 0.82, es * 1.05, 0, 0, 7); c.fill();
        c.fillStyle = hi; c.beginPath(); c.arc(-ex - es * 0.25, ey - es * 0.4, es * 0.32, 0, 7); c.fill();
        c.beginPath(); c.moveTo(ex + es, ey - es); c.lineTo(ex - es * 0.7, ey); c.lineTo(ex + es, ey + es); c.stroke();
      } else closedEyes(1);
      c.lineWidth = Math.max(1.4, lw * 0.6);
      c.beginPath(); c.moveTo(-r * 0.13, ey + r * 0.17); c.quadraticCurveTo(0, ey + r * 0.25, r * 0.13, ey + r * 0.17); c.stroke();
      const tx = r * 0.035, ty = ey + r * 0.205, tw = Math.max(2.6, r * 0.08), th = Math.max(4, r * 0.14);
      c.fillStyle = '#ff6f8a';
      c.beginPath(); c.moveTo(tx - tw, ty); c.lineTo(tx - tw, ty + th - tw); c.arc(tx, ty + th - tw, tw, Math.PI, 0, true); c.lineTo(tx + tw, ty); c.closePath(); c.fill(); c.stroke();
      c.beginPath(); c.moveTo(tx, ty + th * 0.1); c.lineTo(tx, ty + th * 0.55); c.stroke();
    } else {
      [-1, 1].forEach(s => {
        c.fillStyle = ink; c.beginPath(); c.ellipse(s * ex, ey, es * 0.82, es * 1.05, 0, 0, 7); c.fill();
        c.fillStyle = hi; c.beginPath(); c.arc(s * ex - es * 0.25, ey - es * 0.4, es * 0.32, 0, 7); c.fill();
      });
      c.lineWidth = Math.max(1.4, lw * 0.6);
      c.beginPath(); c.arc(-r * 0.055, ey + r * 0.14, r * 0.055, 0.1 * Math.PI, 0.9 * Math.PI); c.arc(r * 0.055, ey + r * 0.14, r * 0.055, 0.1 * Math.PI, 0.9 * Math.PI); c.stroke();
    }
    // 볼터치 (크레파스 빗금)
    [-1, 1].forEach(s => scribble(c, rnd, {
      x0: s * r * 0.52 - r * 0.14, y0: ey + r * 0.12, x1: s * r * 0.52 + r * 0.14, y1: ey + r * 0.3,
      count: 10 + r * 0.6, len: r * 0.08 + 2, width: 1.2 + r * 0.012, color: lv === 0 ? '#ff9db5' : '#ff6f86', alpha: lv === 0 ? 0.75 : 0.6,
      weight: (x, y) => clamp01(1 - (x * x + y * y)),
    }));
    return cv;
  }

  const FACES = ['happy', 'blink', 'squish', 'scared', 'shut', 'shock', 'dizzy', 'tongue', 'tongue2'];
  // 터질 때 과일마다 다른 표정
  const POP_FACE = ['shut', 'shock', 'dizzy', 'shut', 'shock', 'dizzy', 'shut', 'shock', 'shut', 'dizzy', 'shock'];
  const SPRITES = FRUITS.map((_, lv) => {
    const base = buildFruitBody(lv);
    return { size: base.size, faces: Object.fromEntries(FACES.map(fc => [fc, addFace(base, lv, fc)])) };
  });
  function drawFruitSprite(c, lv, x, y, r, angle = 0, face = 'happy', sq = 0, sqA = 0) {
    const sp = SPRITES[lv], s = sp.size * r / FRUITS[lv].r;
    c.save(); c.translate(x, y);

    c.rotate(angle);
    c.drawImage(sp.faces[face], -s / 2, -s / 2, s, s);
    c.restore();
  }

  // ================= 구름 캐릭터 '몽실이' (자체 디자인) =================
  function buildCloud(worried) {
    const w = 140, h = 120, cv = document.createElement('canvas'); cv.width = w * SS; cv.height = h * SS;
    const c = cv.getContext('2d'); c.scale(SS, SS); c.translate(w / 2, h / 2 - 6);
    const rnd = rng(77), lw = 3;
    const puffs = [[-30, 6, 19], [-12, -9, 22], [13, -12, 24], [33, 4, 19], [2, 10, 24]];
    // 팔 (과일을 받치는 손)
    [-1, 1].forEach(s => {
      c.save(); c.translate(s * 20, 30); c.rotate(s * 0.35);
      const p = () => { c.beginPath(); c.ellipse(0, 0, 7, 11, 0, 0, 7); };
      p(); c.fillStyle = '#ffffff'; c.fill(); crayonOutline(c, p, lw * 0.8); c.restore();
    });
    // 외곽선 먼저 굵게 → 흰색으로 덮어 합집합 외곽선만 남김
    c.fillStyle = INK; puffs.forEach(([x, y, r]) => { c.beginPath(); c.arc(x, y, r + lw, 0, 7); c.fill(); });
    c.fillStyle = '#ffffff'; puffs.forEach(([x, y, r]) => { c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); });
    c.save(); c.beginPath(); puffs.forEach(([x, y, r]) => { c.moveTo(x + r, y); c.arc(x, y, r, 0, 7); }); c.clip();
    scribble(c, rnd, { x0: -52, y0: -36, x1: 56, y1: 36, count: 420, len: 7, width: 2, color: '#b9d6f0', alpha: 0.45, weight: (x, y) => clamp01(y * 1.1 + 0.15) });
    scribble(c, rnd, { x0: -52, y0: -36, x1: 56, y1: 36, count: 200, len: 3, width: 1, color: '#e9e2d6', alpha: 0.4 });
    c.restore();
    c.fillStyle = INK; c.strokeStyle = INK; c.lineCap = 'round'; c.lineWidth = 2.6;
    if (worried) {
      [-1, 1].forEach(s => { c.beginPath(); c.moveTo(s * 13 - 4, -1); c.lineTo(s * 13 + 4, 5); c.moveTo(s * 13 - 4, 5); c.lineTo(s * 13 + 4, -1); c.stroke(); });
      c.beginPath(); c.arc(0, 15, 5, Math.PI * 1.15, Math.PI * 1.85); c.stroke();
      c.fillStyle = '#7fc3f0'; c.beginPath(); c.ellipse(28, -6, 3.5, 5.5, 0.3, 0, 7); c.fill(); // 땀방울
    } else {
      [-1, 1].forEach(s => { c.beginPath(); c.ellipse(s * 13, 2, 3.4, 4.4, 0, 0, 7); c.fill(); });
      c.fillStyle = '#fff'; [-1, 1].forEach(s => { c.beginPath(); c.arc(s * 13 - 1, 0.5, 1.3, 0, 7); c.fill(); });
      c.beginPath(); c.arc(0, 8, 5, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke();
    }

    c.beginPath(); c.arc(cx, cy, R, 0, 7); c.stroke(); c.restore();
    // 시계방향 화살표
    for (let i = 0; i < FRUITS.length; i++) {
      const a = -Math.PI / 2 + (i + 0.5) * Math.PI * 2 / FRUITS.length, x = cx + Math.cos(a) * R, y = cy + Math.sin(a) * R;
      c.save(); c.translate(x, y); c.rotate(a + Math.PI / 2);
      c.strokeStyle = 'rgba(138,100,70,.85)'; c.lineWidth = 3.2; c.lineCap = 'round'; c.lineJoin = 'round';
      c.beginPath(); c.moveTo(-5, -6); c.lineTo(3, 0); c.lineTo(-5, 6); c.stroke(); c.restore();
    }
    // 과일 (도달한 단계는 진하게, 아직이면 흐리게)
    FRUITS.forEach((f, i) => {
      const a = -Math.PI / 2 + i * Math.PI * 2 / FRUITS.length, x = cx + Math.cos(a) * R, y = cy + Math.sin(a) * R;
      const rr = 13 + 19 * Math.pow(i / MAX, 0.85);
      if (i === maxLevel) {
        c.save(); c.fillStyle = 'rgba(242,182,50,.45)'; c.beginPath(); c.arc(x, y, rr + 10, 0, 7); c.fill(); c.restore();
      }
      c.globalAlpha = i <= maxLevel ? 1 : 0.38;
      drawFruitSprite(c, i, x, y + rr * 0.08, rr);
      c.globalAlpha = 1;
    });
    // 가운데 글씨
    c.fillStyle = INK; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = '700 46px Gaegu, sans-serif'; c.fillText('진화의', cx, cy - 22);
    c.fillStyle = '#3a9a4e'; c.fillText('고리', cx, cy + 22);
    scribble(c, rnd, { x0: cx - 55, y0: cy + 44, x1: cx + 55, y1: cy + 50, count: 60, len: 10, width: 2, angle: 0.1, color: '#f2b632', alpha: 0.7 });
  }

  // ================= 다음 과일 =================
  let nextChangedAt = 0;
  function drawNext(now) {
    const c = nctx, w = nextCv.width, h = nextCv.height;
    c.clearRect(0, 0, w, h);
    const t = Math.min(1, (now - nextChangedAt) / 350), pop = 0.6 + 0.4 * (1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2));
    const rr = (36 + nextLevel * 9) * pop, bob = Math.sin(now / 420) * 3;
    c.fillStyle = 'rgba(74,44,23,.12)'; c.beginPath(); c.ellipse(w / 2, h / 2 + rr + 4, rr * 0.75, 7, 0, 0, 7); c.fill();
    drawFruitSprite(c, nextLevel, w / 2, h / 2 + bob, rr, Math.sin(now / 600) * 0.08);
  }

  // ================= 게임 상태 =================
  let engine, fruits, particles, popups, mergeQueue, flares, poppers, rings, comboFx;
  let score, heldLevel, nextLevel = 0, heldX, canDrop, lastDrop;
  let overTimer, nearLine = false, gameOver, combo, lastMergeAt, shake, maxLevel = 0, merges, startTime, lastBump = 0, lastWarn = 0;
  const keys = {};
  // 휴대폰 가로 화면에서는 게임을 멈춤 (세로 전용)
  const landscapeLock = matchMedia('(orientation: landscape) and (pointer: coarse) and (max-height: 600px)');
  // 설치형(PWA)·전체화면에서는 브라우저가 지원하면 세로로 고정
  const lockPortrait = () => screen.orientation?.lock?.('portrait').catch(() => {});
  lockPortrait(); addEventListener('pointerdown', lockPortrait, { once: true });
  const randomLevel = () => Math.floor(Math.random() * 5);

  function reset() {
    engine = Engine.create();
    engine.gravity.y = 1.5;
    engine.positionIterations = 8; engine.velocityIterations = 6;
    const wallOpt = { isStatic: true, friction: 0.05, restitution: 0.3, label: 'wall' };
    Composite.add(engine.world, [
      Bodies.rectangle(WALL / 2, H / 2, WALL, H * 3, wallOpt),
      Bodies.rectangle(W - WALL / 2, H / 2, WALL, H * 3, wallOpt),
      Bodies.rectangle(W / 2, H - FLOOR / 2, W, FLOOR, wallOpt),
    ]);

    Events.on(engine, 'afterUpdate', dampSideBounce);
    Events.on(engine, 'collisionStart', onCollide);
    Events.on(engine, 'collisionActive', onCollide);
    fruits = []; particles = []; popups = []; mergeQueue = []; flares = []; poppers = []; rings = []; comboFx = null;
    score = 0; heldLevel = 0; nextLevel = randomLevel(); nextChangedAt = performance.now(); heldX = W / 2;
    canDrop = true; lastDrop = 0; overTimer = 0; gameOver = false;
    combo = 0; lastMergeAt = 0; shake = 0; maxLevel = 0; merges = 0; startTime = performance.now();
    overlay.classList.remove('show');
    updateHud(); drawRing();
  }

  function spawn(level, x, y, vx = 0, vy = 0, popIn = false) {
    const f = FRUITS[level];
    const body = Bodies.circle(x, y, f.r * (popIn ? MERGE_START : 1), {
      restitution: BOUNCE_SMALL + (BOUNCE_BIG - BOUNCE_SMALL) * level / MAX,
      friction: 0.08, frictionStatic: 0.3, frictionAir: 0.004, density: 0.001, label: 'fruit',
    });
    body.level = level; body.born = performance.now(); body.blinkSeed = Math.random() * 3600;
    body.tongueAt = body.born + 4000 + Math.random() * 14000; body.tongueFace = Math.random() < 0.5 ? 'tongue' : 'tongue2';
    body.sq = 0; body.sv = 0; body.sqA = 0;
    Body.setVelocity(body, { x: vx, y: vy });
    Composite.add(engine.world, body); fruits.push(body);
    if (level > maxLevel) { maxLevel = level; drawRing(); }
    return body;
  }

  // 충돌로 생긴 가로 속도를 깎아 작은 과일이 옆으로 튀어나가지 않게 함
  function dampSideBounce() {
    for (const f of fruits) {
      if (!f.hit) continue;
      f.hit = false;
      Body.setVelocity(f, { x: f.velocity.x * (SIDE_DAMP + (1 - SIDE_DAMP) * f.level / MAX), y: f.velocity.y });
    }
  }
  function onImpact(e) {
    const now = performance.now();
    for (const p of e.pairs) {
      const a = p.bodyA, b = p.bodyB, n = p.collision.normal;
      const impact = Math.abs((a.velocity.x - b.velocity.x) * n.x + (a.velocity.y - b.velocity.y) * n.y);
      if (impact < 1.2) continue;
      for (const f of [a, b]) {
        if (f.label !== 'fruit') continue;
        const kick = Math.min(0.32, impact * 0.03 * (1.15 - 0.06 * f.level));
        if (kick > f.sq) { f.sq = kick; f.sv = 0; f.sqA = Math.atan2(n.y, n.x); }
        f.hit = true;
      }

    }
  }

  function onCollide(e) {
    if (gameOver) return;
    for (const p of e.pairs) {
      const a = p.bodyA, b = p.bodyB;
      if (a.label !== 'fruit' || b.label !== 'fruit' || a.level !== b.level || a.merging || b.merging) continue;
      a.merging = b.merging = true;
      mergeQueue.push([a, b]);
    }
  }

  function processMerges(now) {
    for (const [a, b] of mergeQueue) {
      Composite.remove(engine.world, [a, b]);
      fruits = fruits.filter(f => f !== a && f !== b);
      const lv = a.level, x = (a.position.x + b.position.x) / 2, y = (a.position.y + b.position.y) / 2;
      // 사라지는 두 과일은 잠깐 '터지는 표정'으로 부풀었다 사라짐
      for (const f of [a, b]) poppers.push({ lv, x0: f.position.x, y0: f.position.y, cx: x, cy: y, r: f.circleRadius, angle: f.angle, t: 0 });
      Sound.pop(lv);
      combo = now - lastMergeAt < COMBO_WINDOW ? combo + 1 : 1; lastMergeAt = now; merges++;
      const bonus = combo >= 2 ? (combo - 1) * Math.ceil(SCORES[lv] / 2) : 0;
      const gained = SCORES[lv] + bonus;
      score += gained;
      const cs = Math.min(combo, 8);   // 콤보 세기 (8콤보에서 최대)
      popups.push({ x, y: y - FRUITS[lv].r * 0.4, text: '+' + gained, combo, t: 0 });
      burst(x, y, FRUITS[lv].color, Math.round((8 + lv * 2) * (1 + 0.4 * (cs - 1))), FRUITS[lv].r * (1 + 0.15 * (cs - 1)));
      flareBurst(x, y, 5 + Math.floor(lv / 3) + (cs - 1) * 3);
      if (combo >= 2) {
        rings.push({ x, y, r0: FRUITS[lv].r, r1: FRUITS[lv].r * (1.6 + cs * 0.35), w: 3 + cs * 1.5, t: 0 });
        if (combo >= 3) burst(x, y, '#ffd34d', 6 * cs, FRUITS[lv].r);
        shake = Math.max(shake, 2 + cs * 1.8);
        comboFx = { n: combo, t: 0 };
      }
      if (lv < MAX) {
        const nb = spawn(lv + 1, x, y, (a.velocity.x + b.velocity.x) / 2, Math.min(0, (a.velocity.y + b.velocity.y) / 2) - 2.5, true);
        nb.sq = -0.2;
        Sound.merge(lv + 1, combo);

        else if (lv >= 6) shake = Math.max(shake, lv);

      }
    }

    mergeQueue = [];
  }

  // 합체 섬광: 원작과 같은 연출 수치(속도 100px/s, 수명 800ms, 크기 0.4→0)를 따르는 자체 제작 빛 입자
  const FLARE = (() => {
    const s = 128, c = document.createElement('canvas'); c.width = c.height = s;
    const g = c.getContext('2d'), m = s / 2;
    const rg = g.createRadialGradient(m, m, 0, m, m, m);
    rg.addColorStop(0, 'rgba(255,255,255,1)'); rg.addColorStop(0.18, 'rgba(255,255,240,.85)');
    rg.addColorStop(0.45, 'rgba(255,240,200,.25)'); rg.addColorStop(1, 'rgba(255,240,200,0)');
    g.fillStyle = rg; g.fillRect(0, 0, s, s);
    g.fillStyle = 'rgba(255,255,255,.9)';
    for (const a of [0, Math.PI / 2]) {
      g.save(); g.translate(m, m); g.rotate(a);
      g.beginPath(); g.moveTo(-m, 0); g.quadraticCurveTo(0, -3, m, 0); g.quadraticCurveTo(0, 3, -m, 0); g.fill();
      g.restore();
    }
    return c;
  })();
  function flareBurst(x, y, n = 5) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 100 * (0.6 + Math.random() * 0.8);
      flares.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: 0, rot: Math.random() * Math.PI });
    }
  }
  function burst(x, y, color, n, r) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 4 + r * 0.02;
      particles.push({ x: x + Math.cos(a) * r * 0.5, y: y + Math.sin(a) * r * 0.5, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.5, life: 1, size: 3 + Math.random() * 5, color });
    }
  }

  function drop() {
    if (!canDrop || gameOver) return;
    spawn(heldLevel, clampX(heldX, heldLevel), HOLD_Y);
    Sound.drop();
    canDrop = false; lastDrop = performance.now();
    heldLevel = nextLevel; nextLevel = randomLevel(); nextChangedAt = performance.now();
  }
  function clampX(x, lv) { const r = FRUITS[lv].r; return Math.max(WALL + r + 1, Math.min(W - WALL - r - 1, x)); }

  function endGame() {
    gameOver = true; shake = 20; Sound.over();
    const { entry, index } = addRank(score);
    renderRanks(entry);
    setTimeout(() => {
      if (index === 0) Sound.record();
      document.getElementById('overTitle').textContent = index === 0 ? '🎉 신기록!' : index > 0 ? `🏅 랭킹 ${index + 1}위!` : '게임 오버';
      document.getElementById('finalScore').textContent = score.toLocaleString();
      document.getElementById('finalRank').textContent = entry ? fmtDate(entry.at) + ' 달성' : '';
      const sec = Math.round((performance.now() - startTime) / 1000);
      document.getElementById('finalStats').textContent = `최고 과일 ${FRUITS[maxLevel].name} · 합체 ${merges}회 · ${sec}초`;
      overlay.classList.add('show');
    }, 1100);
  }

  function updateHud() {
    $score.textContent = score.toLocaleString();
    const on = combo >= 2 && performance.now() - lastMergeAt < COMBO_WINDOW;
    $combo.textContent = on ? `🔥 ${combo} 콤보!` : '';
    $combo.style.transform = on ? `scale(${1 + Math.min(combo - 2, 5) * 0.08})` : '';
    if (on) { $combo.classList.remove('bump'); void $combo.offsetWidth; $combo.classList.add('bump'); }
  }

  // ================= 입력 =================
  function toWorldX(clientX) { const rc = cv.getBoundingClientRect(); return (clientX - rc.left) * W / rc.width; }
  cv.addEventListener('pointermove', e => { heldX = toWorldX(e.clientX); });
  cv.addEventListener('pointerdown', e => { heldX = toWorldX(e.clientX); cv.setPointerCapture?.(e.pointerId); });
  cv.addEventListener('pointerup', e => { heldX = toWorldX(e.clientX); drop(); });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowDown') { e.preventDefault(); gameOver ? (overlay.classList.contains('show') && reset()) : drop(); }
  });
  addEventListener('keyup', e => { keys[e.key] = false; });
  document.getElementById('restartBtn').addEventListener('click', () => { Sound.click(); reset(); });
  // 모바일 랭킹 시트
  const boardCard = document.querySelector('.board-card');
  document.getElementById('rankBtn').addEventListener('click', () => { Sound.click(); boardCard.classList.toggle('open'); });
  document.getElementById('closeRanks').addEventListener('click', () => { Sound.click(); boardCard.classList.remove('open'); });
  // 시트 바깥을 탭하면 닫기만 하고, 그 탭으로 과일이 떨어지지 않게 함
  let swallowTap = false;
  addEventListener('pointerdown', e => {
    if (boardCard.classList.contains('open') && !boardCard.contains(e.target) && !e.target.closest('#rankBtn')) { e.stopPropagation(); swallowTap = true; boardCard.classList.remove('open'); }
  }, { capture: true });
  addEventListener('pointerup', e => { if (swallowTap) { e.stopPropagation(); swallowTap = false; } }, { capture: true });

  // ================= 루프 =================
  let last = performance.now(), acc = 0;
  const STEP = 1000 / 60;
  function frame(now, manual) {
    const dt = Math.max(0, Math.min(now - last, 100)), ds = dt / 1000; last = now;
    if (keys.ArrowLeft) heldX -= 7 * dt / STEP;
    if (keys.ArrowRight) heldX += 7 * dt / STEP;
    heldX = clampX(heldX, heldLevel);

    if (!gameOver && !landscapeLock.matches) {

      while (acc >= STEP) { growMerged(); Engine.update(engine, STEP); processMerges(now); acc -= STEP; }
      if (!canDrop && now - lastDrop > DROP_COOLDOWN) canDrop = true;
      // 선에 걸친 것은 괜찮고, 과일 아래 끝까지 선 위로 완전히 넘어가야 게임오버 카운트

      const above = fruits.some(f => settled(f) && f.position.y + f.circleRadius < DANGER_Y);
      nearLine = fruits.some(f => settled(f) && f.position.y - f.circleRadius < DANGER_Y);
      overTimer = above ? overTimer + dt : 0;
      if (overTimer > 0 && now - lastWarn > 450 - overTimer * 0.12) { lastWarn = now; Sound.warn(); }
      if (overTimer > OVER_GRACE) endGame();

    }

    }

  }

  function growMerged() {
    for (const f of fruits) {
      const target = FRUITS[f.level].r;

      const k = Math.min(target, f.circleRadius * MERGE_GROW) / f.circleRadius;
      Body.scale(f, k, k);
    }
  }

  function render(now) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    if (shake > 0.5) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    const danger = overTimer / OVER_GRACE;

    ctx.drawImage(CRATE_BACK, 0, 0);

    // 낙하 가이드
    const hx = clampX(heldX, heldLevel);
    if (!gameOver) {
      ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 3; ctx.setLineDash([3, 10]); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(hx, HOLD_Y + FRUITS[heldLevel].r + 4); ctx.lineTo(hx, FLOOR_Y); ctx.stroke(); ctx.setLineDash([]);
    }

    const merong = [];
    for (const f of fruits) {
      const r = f.circleRadius;
      if (now > f.tongueAt + TONGUE_MS) { f.tongueAt = now + 6000 + Math.random() * 16000; f.tongueFace = Math.random() < 0.5 ? 'tongue' : 'tongue2'; }
      const idle = now > f.tongueAt ? f.tongueFace : ((now + f.blinkSeed) % 3600 < 140 ? 'blink' : 'happy');
      const face = gameOver ? 'scared' : (danger > 0.3 && f.position.y - r < DANGER_Y + 40 ? 'scared' : (f.sq > 0.1 || f.speed > 6 ? 'squish' : idle));
      if (face === f.tongueFace) merong.push(f);
      drawFruitSprite(ctx, f.level, f.position.x, f.position.y, r, f.angle, face, Math.max(-0.25, Math.min(0.35, f.sq)) * SQUISH[f.level], f.sqA);
    }

    for (const p of poppers) {
      const k = p.t / POP_MS, m = k * k * 0.6;
      ctx.globalAlpha = 1 - Math.pow(k, 3);
      drawFruitSprite(ctx, p.lv, p.x0 + (p.cx - p.x0) * m, p.y0 + (p.cy - p.y0) * m, p.r * (1 + 0.28 * Math.sin(k * Math.PI * 0.75)), p.angle * (1 - k), POP_FACE[p.lv], Math.sin(k * 22) * 0.08 * (1 - k), 0);
    }
    ctx.globalAlpha = 1;

    ctx.drawImage(CRATE_FRONT, 0, 0);

    ctx.textAlign = 'center'; ctx.lineJoin = 'round';
    for (const f of merong) {
      const r = f.circleRadius, k = (now - f.tongueAt) / TONGUE_MS, fs = Math.round(15 + r * 0.12);
      ctx.globalAlpha = Math.min(1, (1 - k) * 4);
      ctx.font = `700 ${fs}px Gaegu, sans-serif`; ctx.lineWidth = 4; ctx.strokeStyle = '#fff';
      const x = f.position.x + r * 0.55, y = f.position.y - r * 0.75 - k * 8;
      ctx.strokeText('메롱~', x, y); ctx.fillStyle = '#e8456b'; ctx.fillText('메롱~', x, y);
    }
    ctx.globalAlpha = 1;

    // 레드라인: 평소엔 옅게, 과일이 걸치면 진하게, 완전히 넘으면 깜빡임
    const lineA = danger > 0 ? 0.4 + 0.6 * Math.abs(Math.sin(now / 60)) : nearLine && !gameOver ? 0.55 + 0.2 * Math.sin(now / 200) : 0.3;
    ctx.strokeStyle = `rgba(230,40,40,${lineA})`; ctx.lineWidth = danger > 0 ? 6 : 3; ctx.setLineDash([14, 10]);
    ctx.beginPath(); ctx.moveTo(WALL, DANGER_Y); ctx.lineTo(W - WALL, DANGER_Y); ctx.stroke(); ctx.setLineDash([]);

    // 구름 캐릭터와 들고 있는 과일
    const cl = CLOUDS[gameOver || danger > 0.3 ? 'worried' : 'happy'], bob = Math.sin(now / 380) * 2.5;
    ctx.drawImage(cl.canvas, hx - cl.w / 2, CLOUD_Y - cl.h / 2 + 6 + bob, cl.w, cl.h);
    if (!gameOver) {
      ctx.globalAlpha = canDrop ? 1 : 0.4;
      drawFruitSprite(ctx, heldLevel, hx, HOLD_Y + bob * 0.5, FRUITS[heldLevel].r);
      ctx.globalAlpha = 1;
    }

    for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'lighter';
    for (const p of flares) {
      const k = p.t / 800, s = FLARE.width * 0.4 * (1 - k);
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot + k);
      ctx.drawImage(FLARE, -s / 2, -s / 2, s, s); ctx.restore();
    }
    ctx.globalCompositeOperation = 'source-over';

    ctx.textAlign = 'center'; ctx.lineJoin = 'round';
    for (const p of rings) {
      const k = p.t / 450, e = 1 - Math.pow(1 - k, 3);
      ctx.globalAlpha = 1 - k; ctx.strokeStyle = '#fff6c2'; ctx.lineWidth = p.w * (1 - k * 0.6);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r0 + (p.r1 - p.r0) * e, 0, 7); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    for (const p of popups) {
      const life = 900 + Math.min(p.combo, 8) * 60, k = p.t / life, y = p.y - k * 50;
      const cs = Math.min(p.combo, 8), pop = 1 + 0.35 * Math.max(0, 1 - p.t / 160);
      ctx.globalAlpha = 1 - k * k;
      ctx.font = `700 ${Math.round((32 + (cs - 1) * 5) * pop)}px Gaegu, sans-serif`;
      ctx.lineWidth = 7; ctx.strokeStyle = INK; ctx.strokeText(p.text, p.x, y); ctx.fillStyle = cs >= 2 ? '#fff6c2' : '#fff'; ctx.fillText(p.text, p.x, y);
    }
    ctx.globalAlpha = 1;
    // 콤보 배너: 이어질수록 글씨가 크고 색이 뜨거워짐
    if (comboFx) {
      const k = comboFx.t / 1100, cs = Math.min(comboFx.n, 8);
      const pop = comboFx.t < 140 ? 0.4 + 0.9 * comboFx.t / 140 : 1.3 - 0.3 * Math.min(1, (comboFx.t - 140) / 160);
      const fs = Math.round((38 + cs * 9) * pop);
      ctx.save(); ctx.translate(W / 2, TOP + 60 + cs * 3); ctx.rotate(Math.sin(comboFx.t / 60) * 0.03 * cs / 4);
      ctx.globalAlpha = k < 0.75 ? 1 : 1 - (k - 0.75) / 0.25;
      ctx.font = `700 ${fs}px Gaegu, sans-serif`; ctx.lineWidth = 8 + cs; ctx.strokeStyle = INK;
      const txt = `${comboFx.n} 콤보!`;
      ctx.strokeText(txt, 0, 0); ctx.fillStyle = ['#ffd34d', '#ffb21c', '#ff8a1c', '#ff5a36', '#ff3d6e', '#e93dd0'][Math.min(cs - 2, 5)]; ctx.fillText(txt, 0, 0);
      ctx.restore();
    }
    ctx.restore();
  }

  // 보드를 스테이지 안에 비율 유지하며 맞춤
  const stage = document.getElementById('stage'), board = document.getElementById('board');
  function fit() {
    const k = Math.min(stage.clientWidth / W, stage.clientHeight / H);
    board.style.width = W * k + 'px'; board.style.height = H * k + 'px';
  }
  // 주소창 접힘·회전·패널 크기 변화까지 반영
  if (window.ResizeObserver) new ResizeObserver(fit).observe(stage); else addEventListener('resize', fit);
  fit();

  reset();
  // 웹폰트가 늦게 오면 상자 글씨와 진화의 고리를 다시 그림
  document.fonts?.ready.then(() => { buildCrate(); drawRing(); });
  requestAnimationFrame(frame);
  window.__suika = { get state() { return { score, fruits: fruits.length, gameOver, heldLevel, nextLevel, maxLevel }; }, drop, setX: x => heldX = x, bodies: () => fruits, spawn: (lv, x) => spawn(lv, clampX(x, lv), HOLD_Y), step: n => { for (let i = 0; i < n; i++) frame(last + STEP, true); }, sprite: (lv, face) => SPRITES[lv].faces[face] };
})();
</script>
